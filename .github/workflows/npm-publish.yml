name: Publish npm package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'abusezero/abusezero-js' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.12.1'
          registry-url: https://registry.npmjs.org
      - name: Verify release and publish
        shell: bash
        env:
          RELEASE_SHA512: ${{ vars.RELEASE_SHA512 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA512" =~ ^[0-9a-f]{128}$ ]]
          npm install --global --ignore-scripts npm@11.20.0
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" >/dev/null
          archive="$RUNNER_TEMP/abusezero-$version.tgz"
          printf '%s  %s\n' "$RELEASE_SHA512" "$archive" | sha512sum --check --status
          npm publish "$archive" --ignore-scripts --access public
